<text x="830" y="304" font-family="Arial, sans-serif" font-size="14" fill="#1a202c">0</text>
<text x="32" y="398" font-family="Arial, sans-serif" font-size="12" fill="#718096">结果由前端任务、聚合任务组和舰队快照共同计算</text>
